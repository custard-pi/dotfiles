# vim: ft=tmux

%if "#{XDG_CONFIG_HOME}"
TMUX_CONFIG_DIR=$XDG_CONFIG_HOME/tmux
%else
TMUX_CONFIG_DIR=$HOME/.config/tmux
%endif

# misc
source-file "$TMUX_CONFIG_DIR/misc.conf"

# keybindings
source-file "$TMUX_CONFIG_DIR/keybindings.conf"

# local overrides
source-file "$TMUX_CONFIG_DIR/local.conf"

# themes
source-file "$TMUX_CONFIG_DIR/theme.conf"

# plugins (keep TPM initialization at the bottom)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'tmux-plugins/tmux-yank'
run "'$TMUX_CONFIG_DIR/plugins/tpm/tpm'"

