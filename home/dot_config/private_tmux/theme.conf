# vim: ft=tmux

set -g @catppuccin_flavor 'mocha'
# set -g @catppuccin_window_default_text " #W"
# better windws title: pane title if no windows title set, windows title: pane title elsewise
# set -g @catppuccin_window_current_text " #{?automatic-rename,#T,#W: #T}"
# set -g @catppuccin_window_text " #{?automatic-rename,#T,#W: #T}"
# 原始标题逻辑
set -g @window_title_raw ' #{?automatic-rename,#T,#W: #T}'
# <=60 不显示；<=75 保留5；<=100 保留10；<=160 保留16；>160 保留24
set -g @catppuccin_window_text '#{?#{e|<=:#{client_width},60},#{=|3|…:#{E:@window_title_raw}},#{?#{e|<=:#{client_width},75},#{=|5|…:#{E:@window_title_raw}},#{?#{e|<=:#{client_width},100},#{=|10|…:#{E:@window_title_raw}},#{?#{e|<=:#{client_width},160},#{=|16|…:#{E:@window_title_raw}},#{=|24|…:#{E:@window_title_raw}}}}}}'
set -g @catppuccin_window_current_text '#{E:@catppuccin_window_text}'

# color config for tmux_mode_indicator
# style values for prefix prompt
set -g @mode_indicator_prefix_mode_style 'bg=#{@thm_blue},fg=#{@thm_crust}'
# style values for copy prompt
set -g @mode_indicator_copy_mode_style 'bg=#{@thm_yellow},fg=#{@thm_crust}'
# style values for sync prompt
set -g @mode_indicator_sync_mode_style 'bg=#{@thm_red},fg=#{@thm_crust}'
# style values for empty prompt
set -g @mode_indicator_empty_mode_style 'bg=#{@thm_green},fg=#{@thm_crust}'

# Make the status line more pleasant.
set -g status-left ''
set -ag status-left "#{tmux_mode_indicator} "
set -g status-right ''
#set -ag status-right '#(LANG=en_US.UTF-8 date "+%%a %%-d %%b %%H:%%M") '
set -g @datetime_str '#(LC_ALL=C date "+%%a %%-d %%b %%H:%%M") '
set -g @time_str '#(LC_ALL=C date "+%%H:%%M") '
set -ag status-right '#{?#{e|<=:#{client_width},100},,#{?#{e|<=:#{client_width},160},#{E:@time_str},#{E:@datetime_str}}}'
set -ag status-right '#[fg=#{@thm_crust},bg=#{@thm_peach}]#{?window_zoomed_flag, 󰊓 ,}'
set -ag status-right '#[default]#{?window_zoomed_flag, ,}'
set -ag status-right '#[fg=#{@thm_crust},bg=#{@thm_sapphire}] #S #[default]'

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

